management:
  endpoints:
      enabled-by-default: false
      web:
        base-path: /
        path-mapping:
          health: disqualified-officers-search-consumer/healthcheck
        exposure:
          include: health
  endpoint:
      health:
        enabled: true
        show-details: never
        probes:
          enabled: true

spring:
  kafka:
    bootstrap-servers: ${KAFKA4_STREAMING_BROKER_ADDR:kafka4:29092}

    authentication:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: PLAIN
      sasl.jaas.config: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA4_STREAMING_BROKER_USERNAME}" password="${KAFKA4_STREAMING_BROKER_PASSWORD}";

api:
  search-api-key: ${CHS_API_KEY:apikey}
  api-url: ${API_URL:http://localhost:8888}
  internal-api-url: ${INTERNAL_API_URL:localhost}

disqualified-officers:
  search:
    group-id: ${GROUP_ID:disqualified-officers-search-consumer}
    retry-attempts: 4
    backoff-delay: 100
    topic: stream-disqualifications
    retry-suffix: ${RETRY_SUFFIX:-retry}
    error-suffix: ${ERROR_SUFFIX:-error}

logger:
  namespace: disqualified-officers-search-consumer

logging:
  level:
    org.apache.kafka.clients: ${KAFKA_LOGGING_LEVEL:INFO}
    org.apache.kafka: ${KAFKA_LOGGING_LEVEL:INFO}
    org.springframework.kafka: ${KAFKA_LOGGING_LEVEL:INFO}
    org.springframework.kafka.listener: ${KAFKA_LOGGING_LEVEL:INFO}

wiremock:
  server:
    port: 8888
